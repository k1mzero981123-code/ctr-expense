<script>/* 2026-11-06 Vercel 정지(무료 한도, DEPLOYMENT_DISABLED) → 업무관리 사이트와 같게: 화면은 GitHub Pages, 서버 일은 Supabase 서버 함수 ex-api.
   *.github.io 에서 열렸을 때만 "/api/…" 부르기를 서버 함수 주소로 바꾼다. 주소가 달라 쿠키를 못 쓰므로 로그인 열쇠는 localStorage(ex-sid) → 머리글 x-exsid.
   로컬(8095)에서는 아무것도 안 바꾼다. 서버 쪽 입구: edge/index.js */
(function(){
  if (!/\.github\.io$/i.test(location.hostname)) return;
  var BASE = "https://tzqnxmkfzmginhligcul.supabase.co/functions/v1/ex-api", K = "ex-sid";
  function tok(){ try{ return localStorage.getItem(K) || ""; }catch(e){ return ""; } }
  function setTok(t){ try{ if (t) localStorage.setItem(K, t); else localStorage.removeItem(K); }catch(e){} }
  var of = window.fetch.bind(window);
  window.fetch = function(input, init){
    if (typeof input !== "string" || input.indexOf("/api/") !== 0) return of(input, init);
    init = Object.assign({}, init || {}); var h = new Headers(init.headers || {}), t = tok(); if (t) h.set("x-exsid", t);
    init.headers = h; init.credentials = "omit";
    return of(BASE + input, init).then(function(r){ var s = r.headers.get("x-exsid-set"); if (s !== null) setTok(s); return r; });
  };
})();</script>

<style>
:root{

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:13px}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
.hidden{display:none!important}
/* 로그인 */

/* 머리 */
header{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:22px;position:sticky;top:0;z-index:20}

.hright button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px}
main{padding:18px 22px 40px;max-width:1700px;margin:0 auto}
/* 타일 */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}

.tile.red{border-color:#f3c2c0;background:var(--r-bg)} .tile.red .v{color:var(--r)}
.tile.yel{border-color:#f0de8a;background:var(--y-bg)} .tile.yel .v{color:var(--y)}
.tile.grn .v{color:var(--g-d)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.panel h3 small{font-weight:400;color:var(--ink-2);font-size:12px}

.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.t th{position:sticky;top:0;z-index:2;background:#f3f6f4;color:var(--ink-2);font-weight:700;text-align:center;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:center;white-space:nowrap;vertical-align:middle}
table.t td.l{text-align:left;white-space:normal;min-width:260px}
table.t td.r,table.t th.r{text-align:right}
table.t tr.click{cursor:pointer}

.b{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:18px}
.b.red{background:var(--r-bg);color:var(--r)} .b.yel{background:var(--y-bg);color:var(--y)} .b.org{background:var(--o-bg);color:var(--o)}
.b.grn{background:var(--g-bg);color:var(--g-d)} .b.gray{background:var(--gray-bg);color:var(--gray)}
.mono{font-variant-numeric:tabular-nums}
.neg{color:var(--r);font-weight:700} .pos{color:var(--g-d)}

/* 거르기 */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}

.seg button:last-child{border-right:0}

.bar select,.bar input{height:31px;border:1px solid var(--line);border-radius:8px;padding:0 9px;background:#fff}

.bar .cnt{margin-left:auto;color:var(--ink-2);font-size:12px}

/* 창 */
#mask{position:fixed;inset:0;background:rgba(17,24,39,.35);backdrop-filter:blur(2px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto}
#modal{background:#fff;border-radius:14px;width:min(1180px,100%);box-shadow:0 20px 60px rgba(0,0,0,.2)}

.rv{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.rv textarea{flex:1;height:58px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.rv .sb{display:flex;flex-direction:column;gap:6px}
.rv .sb button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;min-width:120px}
.rv .sb button.on.ok{background:var(--g);color:#fff;border-color:var(--g)}
.rv .sb button.on.hold{background:#e0a800;color:#fff;border-color:#e0a800}
.rv .sb button.on.bad{background:var(--r);color:#fff;border-color:var(--r)}
.rv .who{font-size:11.5px;color:var(--ink-2);margin-top:4px}
h4{margin:14px 0 8px;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--ink-2)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--g);color:#fff;padding:9px 18px;border-radius:9px;z-index:200;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.note{color:var(--ink-2);font-size:12px;line-height:1.7}

.tiles.four{grid-template-columns:repeat(4,1fr)}
table.t.main td{padding:9px 8px;font-size:13px}
table.t.main th small{font-weight:400}

table.t.main td .sub{font-size:11.5px;color:var(--y)}
table.t.main tr.sub-row>td{background:#fafcfb;padding:6px 14px 12px;text-align:left}
table.t.inner{border:1px solid var(--line);border-radius:8px;background:#fff}

table.t.inner tr.tot td{font-weight:700;background:#f7f9f8;text-align:right}

/* ───── 2026-11-04 디자인 정리 (사용자: "너무 밤티") — 회사 옅은 그린·옅은 레드·옅은 노랑 유지 ───── */
:root{ --bg:#f3f5f4; --line:#e3e7e5; --line-2:#eef1ef; --ink:#17201b; --ink-2:#5b6660; --sh:0 1px 2px rgba(16,24,20,.04),0 4px 14px rgba(16,24,20,.05); }
body{font-size:13.5px;letter-spacing:-.1px}
header{height:62px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(16,24,20,.04);border-bottom:0;padding:0 28px}
.logo{font-size:18px}.logo span{font-size:14px;padding-left:10px;margin-left:10px;border-left:1px solid var(--line)}
nav{gap:2px;height:100%}
nav button{position:relative;height:100%;border-radius:0;padding:0 18px;font-size:14px;color:var(--ink-2)}
nav button:hover{color:var(--ink);background:#f7faf8}
nav button.on{background:none;color:var(--g-d)}
nav button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--g)}
nav button .n{min-width:20px;line-height:19px;font-weight:700;margin-left:6px}
main{padding:22px 28px 48px}
/* 타일 — 흰 카드 + 왼쪽 색 띠 */
.tiles{gap:14px;margin-bottom:18px}
.tile{position:relative;border:0;border-radius:14px;padding:16px 18px 16px 22px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#d5ddd8}
.tile:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(16,24,20,.05),0 10px 24px rgba(16,24,20,.08)}
.tile .k{font-size:12.5px;font-weight:500}

.amt{font-weight:700;font-size:13.5px}

/* 2026-11-04 사용자: "발주번호는 길고 현장명은 짧고 … 옆으로 드래그 하는 일도 없게 … 양 여백도 너무 넓어" */
main{max-width:none;padding:16px 16px 40px}
header{padding:0 16px}

.slot .stg{font-weight:700;border:1px solid transparent}
.stg.s1{background:#ffe680;color:#7a5a00;border-color:#f0c929}
.stg.s2{background:#bfe8cf;color:#14633a;border-color:#7fcf9f}

/* 위 카드 작게 — 2026-11-04 사용자: "대시보드 4개가 너무 큰데 일단 좀 줄여주고" */
.tiles{gap:10px;margin-bottom:10px}
.tile{padding:8px 14px 8px 16px;border-radius:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tile::before{width:4px}
.tile .k{font-size:12px}
.tile .v{font-size:17px;margin-top:0}

/* ───────────── 판정 ─────────────

const S = { page: "main", open: new Set(), data: null, f: { main: { who: "", st: "", q: "", view: "all", range: "10" }, rej: { st: "4", lv: "", who: "", q: "", view: "rej" },  check: { st: "open", kind: "", who: "", q: "" }, docs: { who: "", st: "", q: "", only: "" }, pos: { who: "", st: "", q: "", range: "10" } } };

/* 현장 — 지출결의 제목 "(유통) 그린_한화 …" 의 '그린', "(유통) 3개소(레디투홈,동해물산,태원실업)_…" 의 세 곳.

const normSite = (x) => String(x || "").replace(/\s+/g, "").replace(/태양광발전소|발전소$/g, "").toLowerCase();

const lineSite = (l) => normSite(String(l.rem || "").replace(/^\s*\([^)]*\)\s*/, ""));
/* 지출결의 하나가 가리키는 발주 품목 줄들 — 현장이 맞는 줄, 못 찾으면 그 발주들의 모든 줄 */
function baseLines(d, P){
  const all = [];

  if (!d._sites.length) return all;
  const m = (x, s) => x.site && (x.site === s || x.site.includes(s) || s.includes(x.site));
  /* 제목의 현장이 하나라도 품목 줄에서 안 찾아지면('어만리2개소' 등) 현장별로 나누지 않고 발주 전체와 비교한다 */
  if (!d._sites.every(s => all.some(x => m(x, s)))) return all;

}
/* 댓글로 발주번호 정정 — 제목에 잘못 적고 결재 댓글로 "발주번호 : PO…" 를 알려 준 경우(2026-11-02 사용자).
   가장 늦은 댓글 중 '발주번호·오기·정정' 말과 함께 제목에 없는 PO 번호가 있으면 그 번호(들)로 바꿔 계산한다 */
function fixOf(d){

}
const normVendor = (s) => String(s || "").replace(/\(주\)|㈜|주식회사|[\s()]/g, "").toLowerCase();
const shortNo = (d) => (d.docNo || "번호없음").replace(/^CTRE-지출결의서\(일반\)-/, "");

/* 대상은 원재료·상품 지출결의만(2026-11-04 사용자: "경비 부분 말고 원재료 부분만 … 원재료랑 상품!").
   발주가 있으면 발주 품목 줄의 계정구분(acctFgNm: 상품·원재료·수익·비용)으로, 발주번호가 없으면 제목의 품목 말로 가린다 */
const MAT_ACCT = /원재료|상품/;
const MAT_WORD = /모듈|인버터|모니터링|접속반|구조물|케이블|배터리|ESS|변압기|수배전|큐비클|\d\s*k?w\b|\d\s*장/i;
const NOT_MAT = /카드지출|경조|유류비|경비정산|출장비|운임|창고료|지게차|입회비|교육비|복리후생|통신비|교통비|법인카드/;
const poMat = (p) => (p.lines || []).some(l => MAT_ACCT.test(l.acct || p.acct || ""));
function isMat(d, P){
  const t = d.docTitle || "", pos = poOf(t);
  if (pos.length){ const ps = pos.map(n => P.get(n)).filter(Boolean); return ps.length ? ps.some(poMat) : !NOT_MAT.test(t); }

function judge(){
  const D = S.data, P = new Map(D.pos.map(p => [p.poNb, p])), R = new Map(D.reviews.map(r => [r.key, r]));
  /* 지출결의 상세(계정 줄) — ex_meta 'det:YYYYMM' */
  const DET = {}; for (const k in D.meta) if (k.startsWith("det:")) Object.assign(DET, D.meta[k]);
  for (const d of D.docs){ d._det = DET[d.linkKey] ? DET[d.linkKey].lines : null; d._extra = (d._det || []).filter(l => /운반비/.test(l.t)).reduce((s, l) => s + (+l.sum || 0), 0); }   /* _extra = 운반비 계정 줄(2026-11-05 사용자: "운반비 국내 계정을 제외한 나머지 금액에서 변경이 없으면 … 차이없다고") */
  /* 입고(=매입 계산서 발급, 입고일 = 계산서 발급일) — 발주 품목 줄마다 입고 수량·금액·단가. 거래처 단가 인하를 입고에서 바꿔 넣는 경우가 있다(2026-11-04 사용자) */
  for (const p of D.pos){ p._rcv = []; for (const l of p.lines) l._rcv = []; }
  for (const r of ((D.meta.rcv || {}).rows || [])){
    const [po, sq, rv, dt, qt, um, sup, vat, sum, fx] = r, p = P.get(po); if (!p) continue;
    const x = { po, sq, rv, dt, qt, um, sup, vat, sum, fx }; p._rcv.push(x);
    const l = p.lines.find(y => y.sq === sq); if (l) l._rcv.push(x);
  }
  for (const p of D.pos){
    p._rcvSum = p._rcv.reduce((s, x) => s + (+x.sum || 0), 0);
    p._rcvAll = p.lines.length > 0 && p.lines.every(l => l._rcv.reduce((s, x) => s + (+x.qt || 0), 0) >= (+l.qt || 0) - 1e-9);
    p._rcvLast = p._rcv.reduce((m, x) => String(x.dt) > m ? String(x.dt) : m, "");
    /* 단가가 다른 줄 — 외화(환율로 조금씩 다름)는 0.5% 넘을 때만 */
    p._cut = [];
    for (const l of p.lines) for (const x of l._rcv) if (Math.abs((+x.um || 0) - (+l.um || 0)) > (x.fx ? Math.abs(l.um) * 0.005 : 0.5))
      p._cut.push({ sq: l.sq, nm: l.dc || l.nm, from: +l.um, to: +x.um, qt: +x.qt, gap: (+x.um - +l.um) * (+x.qt || 0) * (l.vat ? 1.1 : 1), dt: x.dt });
  }
  const docs = D.docs.filter(d => isMat(d, P)).sort((a, b) => (a.upDate || "").localeCompare(b.upDate || "") || String(a.docNo || "").localeCompare(String(b.docNo || "")));
  const byPo = new Map(), linePaid = new Map();
  for (const d of docs){
    d._titlePos = poOf(d.docTitle); d._fix = fixOf(d); d._pos = d._fix ? d._fix.pos : d._titlePos; d._stage = stageOf(d.docTitle); d._pct = pctOf(d.docTitle); d._vendor = vendorOf(d.docTitle); d._sites = sitesOf(d.docTitle); d._live = LIVE(d); d._iss = [];
    for (const n of d._pos){ if (!byPo.has(n)) byPo.set(n, []); byPo.get(n).push(d); }
    d._base = baseLines(d, P); d._baseSum = d._base.reduce((s, x) => s + (x.l.sum || 0), 0);
    d._siteLbl = [...new Set(d._base.filter(x => x.site).map(x => x.l.rem.replace(/^\s*\([^)]*\)\s*/, "").replace(/\s*태양광\s*발전소$/, "")))].join(", ");
    /* 금액을 해당 품목 줄에 금액 비율로 나눠 쌓는다(진행 + 결재완료만) */
    if (d._live && d._baseSum > 0) for (const x of d._base){ const v = d.docSumAm * (x.l.sum || 0) / d._baseSum, o = linePaid.get(x.key) || { done: 0, going: 0 }; if (d.approState === "1") o.done += v; else o.going += v; linePaid.set(x.key, o); }
  }

    /* ① 같은 단계(선금·잔금·대금) 지출결의가 같은 현장(품목 줄)에 2건 이상 — 중도금·차액은 여러 번일 수 있어 뺀다 */
    const stg = live.filter(d => d._stage !== "중도금" && d._stage !== "차액"), used = new Set();

      if (grp.length > 1){

        const lv = grp[0]._stage === "선금" || !base || tot > base + tolOf(base) ? "red" : "org";   /* 잔금·대금을 나눠 낸 경우(합계가 발주 안)는 주황 */
        iss.push({ k: "dup", lv, t: (grp[0]._siteLbl ? "[" + grp[0]._siteLbl + "] " : "") + `같은 현장에 ${grp[0]._stage} 지출결의서가 ${grp.length}번 올라왔어요: ` + grp.map(d => shortNo(d) + " " + won(d.docSumAm) + "원(" + ST[d.approState] + ")").join(" · ") + (lv === "org" ? " → 합계는 발주금액 안이라, 나눠서 낸 건지 확인해 주세요" : " → 두 번 낸 건 아닌지 확인해 주세요"), docs: grp });

    const am = {}; for (const d of live){ const x = Math.round(d.docSumAm); (am[x] = am[x] || []).push(d); }
    /* 같은 현장(품목 줄이 겹침)끼리만 — 한 발주 안 다른 현장의 선금이 우연히 같은 금액인 건 중복 아님(2026-11-05 PO2610000313) */
    for (const [x, a0] of Object.entries(am)){ const a = a0.filter(d => a0.some(o => o !== d && [...inPo(o)].some(k => inPo(d).has(k)))); if (a.length > 1 && !iss.some(i => i.k === "dup" && a.every(d => i.docs.includes(d)))) iss.push({ k: "same", lv: "red", t: `금액이 똑같은(${won(x)}원) 지출결의서가 ${a.length}번 올라왔어요: ` + a.map(shortNo).join(" · ") + " → 같은 돈을 두 번 내는 건 아닌지 확인해 주세요", docs: a }); }
    /* ⑤ 제목의 거래처가 발주 거래처와 다름 — 제목에 다른 발주번호를 적었을 수 있다(2026-11-04 사용자: 제목 오기 체크) */
    if (p) for (const d of live){ const v = normVendor(d._vendor), pv = normVendor(p.trNm);
      if (v && pv && !(pv.includes(v) || v.includes(pv) || pv.slice(0, 3) === v.slice(0, 3)) && !(d._fix && !d._fix.pos.includes(n)))
        iss.push({ k: "vendor", lv: "org", t: `지출결의서 제목의 거래처는 '${d._vendor}'인데 발주 거래처는 '${p.trNm}'예요 → 제목에 발주번호를 잘못 적었는지 확인해 주세요 · ` + shortNo(d), docs: [d] }); }
    let done = 0, going = 0;
    if (p){
      /* ③ 현장(품목 줄 묶음)별로 지출결의 합계가 발주금액(VAT 포함)보다 큼 */
      const g = new Map();
      for (const l of p.lines){ const k = lineSite(l) || "-", o = g.get(k) || { lbl: l.rem.replace(/^\s*\([^)]*\)\s*/, "").replace(/\s*태양광\s*발전소$/, ""), sum: 0, paid: 0 }; const lp = linePaid.get(n + "#" + l.sq) || { done: 0, going: 0 };

      const multi = g.size > 1;
      /* 운반비(발주에 결재 안 받고 지출결의에만 쓰는 경우)는 빼고 비교 — 2026-11-05 사용자 */
      const frt = live.reduce((s, d) => { const all = d._pos.reduce((a, x) => a + ((P.get(x) || {}).sum || 0), 0); return s + d._extra * (d._pos.length > 1 && all > 0 ? p.sum / all : 1); }, 0);
      for (const o of g.values()) if (o.paid - (p.sum ? frt * o.sum / p.sum : 0) > o.sum + tolOf(o.sum))
        iss.push({ k: "over", lv: o.paid > o.sum * 1.05 ? "red" : "org", t: (multi ? "[" + o.lbl + "] " : "") + `발주는 ${won(o.sum)}원인데 지출결의서를 모두 더하면 ${won(o.paid)}원이에요 → 발주보다 ${won(o.paid - o.sum)}원 더 썼어요 (발주의 ${(o.paid / o.sum * 100).toFixed(1)}%)` });
      /* ④ 제목의 % 와 금액이 맞지 않음 — 그 현장 품목 줄 금액 × % */
      for (const d of live) if (d._pct != null && d._baseSum > 0){
        /* 2026-11-06 사용자: (PO2610000246 '잔금 80% [..] → 발주 − 선금 … 원인데 기안 … 적음' 캡처) "이따위로 적어두면 내가 어떻게 이해할까? 14살짜리도 보면 바로 이해할 수 있도록"
           → ① 쉬운 말로. ② 입고(계산서)가 다 들어온 품목 줄이면 계산서 금액 기준으로도 맞춰 봄 — 입고 때 단가가 내려가 잔금을 계산서에 맞춰 낸 건 정상(그 건은 계산서 − 선금 과 딱 맞았음) */
        const mine = new Set(d._base.map(x => x.key));
        const bl = d._base.map(x => x.l), rcvAll = bl.length && bl.every(l => (l._rcv || []).reduce((s, r) => s + (+r.qt || 0), 0) >= (+l.qt || 0) - 1e-6);

      const chgX = rc.filter(x => Math.abs(+x.um - l.um) > 0.5).pop(), chg = chgX ? +chgX.um : 0;
      const rcvRow = (x) => { const u = +x.um, dif = Math.abs(u - l.um) > 0.5;
        return `<tr class="rc"><td><span class="lt-tag rc">입고</span></td><td>${ymd(x.dt).slice(5)}</td><td class="mono">${esc(x.rv)}</td><td class="r">${won(x.qt)}</td>
          <td class="r">${won(l.um)}</td><td class="r ${dif ? "neg" : "none"}">${dif ? won(u) : "없음"}</td><td class="r">${won(x.sup)}</td><td class="r"><b class="blu">${won(x.sum)}</b></td></tr>`; };
      const nm = String(l.nm || "").trim(), dc = String(l.dc || "").trim();
      return `<tr class="it"><td colspan="8"><span class="sq">${l.sq}</span><b>${esc(dc && dc !== "-" ? dc : nm)}</b></td></tr>
          <tr><td><span class="lt-tag">발주</span></td><td>${ymd(p.poDt).slice(5)}</td><td class="mono">${poNoLink(n).replace(/<button[\s\S]*$/, "")}</td><td class="r">${won(l.qt)}</td><td class="r">${won(l.um)}</td><td class="r ${chg ? "neg" : "none"}">${chg ? won(chg) : "없음"}</td><td class="r">${won(l.sup)}</td><td class="r"><b>${won(l.sum)}</b></td></tr>
          ${rc.length ? rc.map(rcvRow).join("") + (rc.length > 1 ? `<tr class="rc tot"><td></td><td colspan="2">입고 합계${rq < l.qt ? " · 일부" : ""}</td><td class="r">${won(rq)}</td><td></td><td></td><td class="r">${won(rc.reduce((s, x) => s + (+x.sup || 0), 0))}</td><td class="r"><b class="blu">${won(rs)}</b></td></tr>` : "")
            : `<tr class="rc none"><td><span class="lt-tag none">입고</span></td><td colspan="7">입고 전 (계산서 없음)</td></tr>`}`; };
  const siteCard = (ls) => {
      /* 2026-11-06 사용자: (') 가흥혜숙 태양광발전소' 로 잘려 나온 캡처) "가지고 올거면 확실하게 다 가져와. 왜 저렇게 어중간하게 들고오는거야 100% 맞춰놔" → 발주 품목 줄 비고를 손대지 않고 그대로 */
      const site = String(ls[0].rem || "").trim();
      return `<div class="pd-card ln">
        <div class="r1"><b>${esc(site || "(현장 비고 없음)")}</b><span class="site">품목 ${ls.length}줄</span></div>
        <table class="lt"><colgroup><col style="width:48px"><col style="width:50px"><col><col style="width:52px"><col style="width:76px"><col style="width:96px"><col style="width:96px"><col style="width:102px"></colgroup>
          <thead><tr><th></th><th>날짜</th><th>번호</th><th class="r">수량</th><th class="r">단가</th><th class="r">변경단가</th><th class="r">공급가액</th><th class="r">합계액</th></tr></thead>
          <tbody>${ls.map(lineRows).join("")}</tbody></table></div>`; };
  const bySite = (ls) => { const g = new Map(); for (const l of ls){ const k = lineSite(l) || "-"; if (!g.has(k)) g.set(k, []); g.get(k).push(l); } return [...g.values()]; };
  const left = p ? `<div class="pd-col"><h4>발주 품목 <small>${p.lines.length}줄</small></h4>${bySite(p.lines).map(siteCard).join("")}</div>` : "";
  /* 오른쪽 — 지출결의: 선금 / 잔금(잔금·100%·중도금·차액) 나눠서 카드 */
  const card = (d) => { const ks = [...new Set(d._iss)];
    return `<div class="pd-card doc ${d._live ? "" : "dim"}">
      <div class="r1"><span class="stg ${chipCls(d)}">${esc(stageLbl(d))}</span><b class="mono amt">${won(d.docSumAm)}</b>${d._splitOf ? `<span class="split">${d._splitN}곳 한 건 ${won(d._splitOf)} 중 이 현장 몫</span>` : ""}${stB(d)}${ks.slice(0, 2).map(k => `<span class="b ${KIND[k][1]}">${KIND[k][0]}</span>`).join("")}</div>
      <div class="r2"><span><i>문서번호</i>${d.docId ? `<a class="gwdoc" href="${esc(eapUrl(d))}" target="_blank" rel="noopener" title="아마란스에서 이 지출결의서 열기">${esc(shortNo(d))} ↗</a>` : esc(shortNo(d))}</span><span><i>기안</i>${esc(d.empNm)} ${esc(String(d.upDate).slice(5))}</span><span><i>지급요청</i>${ymd(d.payDt).slice(5) || "-"}</span>${(d._det || []).filter(l => !DET_MAT.test(l.t)).map(l => `<span class="acct"><i>계정</i>${esc(l.t.replace(/^\[[^\]]*\]\s*/, ""))} ${won(l.sum)}</span>`).join("")}${d.approState === "0" && d.nextEmpNm ? `<span><i>다음</i>${esc(d.nextEmpNm)}</span>` : ""}</div>
      <div class="r3 t" ${T(d.docTitle)}>${esc(d.docTitle)}</div>${fixNote(d, n)}</div>`; };
  const pre = docs.filter(SLOT1), post = docs.filter(d => !SLOT1(d));
  const right = `<div class="pd-col"><h4>지출결의 <small>${docs.length}건 · 흐린 카드는 반려·삭제·미상신(합계 제외)</small></h4>
    <div class="pd-sec s-pre"><div class="h">① 선금</div>${pre.map(card).join("") || '<div class="none">선금 지출결의 없음</div>'}</div>
    <div class="pd-sec s-post"><div class="h">② 잔금 <small>(100% 한 번에 · 중도금 · 차액 포함)</small></div>${post.map(card).join("") || '<div class="none">잔금 지출결의 없음</div>'}</div></div>`;
  /* 한 발주에 현장이 여럿이면 현장별로 줄을 나눔 — 2026-11-05 사용자: "한발주서 안에 현장을 같이 결재 진행하는 경우도 있어. 시티알 태양광발전소 저 현장에 대한 지출결의서를 같이 나열해줘야".
     현장마다: 왼쪽 그 현장 품목 / 오른쪽 그 현장 선금 · 잔금. 지출결의의 현장은 제목 현장 ↔ 품목 줄 비고(baseLines) 로 맞춤. 어느 현장인지 못 가른 문서는 맨 아래 '현장 구분 안 됨' */
  const sites = p ? [...new Set(p.lines.map(l => lineSite(l) || "-"))] : [];
  let body;
  if (p && sites.length > 1){
    const allSq = p.lines.length, used = new Set();
    const docOf = (sk) => docs.filter(d => { const b = (d._base || []).filter(x => x.po === n); return b.length && b.length < allSq && b.every(x => (lineSite(x.l) || "-") === sk); });
    const two = (ds) => { const a = ds.filter(SLOT1), b = ds.filter(d => !SLOT1(d));
      return `<div class="ps-two"><div class="pd-sec s-pre"><div class="h">① 선금</div>${a.map(card).join("") || '<div class="none">없음</div>'}</div><div class="pd-sec s-post"><div class="h">② 잔금</div>${b.map(card).join("") || '<div class="none">없음</div>'}</div></div>`; };
    /* 여러 현장을 한 건으로 올린 지출결의 나누기 — 2026-11-06 사용자: "비고란에 1호 2호 3호 이지만 발주등록 위 비고는 무지1-3호 … 저 선금이 각 호기별 선금 20%로 반영을 하였을 때 총 합계액이 20%가 맞으면 분리".
       기준 품목 줄(이 발주 안) 합계 × 제목 비율(없으면 100%) 이 지출결의 금액과 맞으면(오차 안) 현장별 품목 합계 비율로 나눠 각 현장 줄에 '나눔' 카드로. 안 맞으면 그대로 '현장 구분 안 됨' */
    const splits = new Map();   /* 현장 → [나눈 카드용 복사본] */
    for (const d of docs){
      const b = (d._base || []).filter(x => x.po === n), bs = b.reduce((s, x) => s + (+x.l.sum || 0), 0), tot = +d.docSumAm || 0;
      const bySite = new Map(); for (const x of b){ const k = lineSite(x.l) || "-"; bySite.set(k, (bySite.get(k) || 0) + (+x.l.sum || 0)); }
      if (bySite.size < 2 || !bs || !d._baseSum) continue;
      const pct = d._pct != null ? d._pct : (d._stage === "대금" ? 100 : null);
      if (pct == null || Math.abs(tot - d._baseSum * pct / 100) > tolOf(d._baseSum * pct / 100)) continue;
      const mine = tot * bs / d._baseSum, ks = [...bySite.keys()]; let left = Math.round(mine);
      ks.forEach((k, i) => { const v = i === ks.length - 1 ? left : Math.round(mine * bySite.get(k) / bs); left -= v;
        if (!splits.has(k)) splits.set(k, []); splits.get(k).push(Object.assign(Object.create(d), { docSumAm: v, _splitOf: tot, _splitN: ks.length })); });
      used.add(d);
    }
    const rows = sites.map(sk => {
      const ls = p.lines.filter(l => (lineSite(l) || "-") === sk), ds = docOf(sk).concat(splits.get(sk) || []); ds.forEach(d => used.add(d));
      const nm = String(ls[0].rem || "").trim() || "(현장 비고 없음)";   /* 비고 그대로(2026-11-06 "100% 맞춰놔") */
      const sum = ls.reduce((s, l) => s + (+l.sum || 0), 0), paidS = ds.filter(d => d._live).reduce((s, d) => s + (+d.docSumAm || 0), 0);
      return `<div class="ps-row"><div class="ps-h"><b>${esc(nm)}</b><span>발주 ${won(sum)}</span><span>지출결의 ${won(paidS)} (${ds.length}건)</span><span class="${paidS - sum > tolOf(sum) ? "neg" : ""}">남은 ${won(sum - paidS)}</span></div>
        <div class="pd-body"><div class="pd-col">${siteCard(ls)}</div><div class="pd-col">${two(ds)}</div></div></div>`;
    });
    const rest = docs.filter(d => !used.has(d));
    if (rest.length) rows.push(`<div class="ps-row"><div class="ps-h"><b>현장 구분 안 됨</b><span>제목의 현장을 품목 줄에서 못 찾았거나 여러 현장을 한 번에 쓴 지출결의 ${rest.length}건</span></div><div class="pd-col">${two(rest)}</div></div>`);
    body = `<h4 class="ps-top">현장별 <small>${sites.length}곳 · 흐린 카드는 반려·삭제·미상신(합계 제외)</small></h4>${rows.join("")}`;
  } else body = `<div class="pd-body">${left}${right}</div>`;
  return `<div class="mh"><h2>${esc(n)}</h2>${c ? rvB(c) + " " + kindBadges(c.iss) : ""}<button class="x" data-close>×</button></div>
    <div class="mb">${info}${iss}${body}${c ? reviewBox(c) : ""}</div>`;
}
function showDoc(d, c){
  openModal(`<div class="mh"><h2>${esc(d.docNo || "(문서번호 없음)")}</h2>${c ? rvB(c) : ""}<button class="x" data-close>×</button></div><div class="mb">
    ${c ? `<div class="iss">${c.iss.map(i => `• <b>${KIND[i.k][0]}</b> — ${esc(i.t)}`).join("<br>")}</div>` : ""}${fixNote(d)}${docRows(c ? c.docs : [d])}${d._pos.length ? `<div class="note" style="margin:8px 0">발주: ${d._pos.map(poLink).join(" · ")} (누르면 발주 상세)</div>` : ""}${c ? reviewBox(c) : ""}</div>`);
}
async function saveReview(btn){
  const box = btn.closest(".rv"), status = btn.dataset.rv, memo = $("#rvMemo").value.trim();
  try{
    const r = await api("review", { key: box.dataset.key, status, memo, sig: box.dataset.sig });
    const rs = S.data.reviews.filter(x => x.key !== box.dataset.key); if (r.review) rs.push(r.review); S.data.reviews = rs;
    judge(); render(); toast(status ? "저장했습니다" : "표시를 지웠습니다");
    const key = box.dataset.key;
    if (key.startsWith("po:")) showPo(key.slice(3)); else if (key.startsWith("rej:")) showRej(key); else showCase(key);
  }catch(e){ toast(e.message); }
}

/* ───────────── 시작 · 이벤트 ───────────── */
/* 바뀐 것만 합치기 — 2026-11-06 사용자: "업데이트 이력을 계속 하지말고 새로운것만 계속 업데이트를 해줘". 처음 열 때만 전체, 그 뒤(5분마다 · 수집 시각 누름)는 ?since= 로 그 뒤 바뀐 것만 받아 key 로 합친다.
   바뀐 게 없으면 판정 · 화면을 다시 그리지 않는다(열어 둔 표 · 스크롤 그대로) */
function mergeDelta(D, j){
  let ch = false;
  const up = (arr, rows, keyOf) => { if (!rows.length) return; ch = true; const ix = new Map(arr.map((x, i) => [keyOf(x), i])); for (const r of rows){ const i = ix.get(keyOf(r)); if (i == null){ ix.set(keyOf(r), arr.length); arr.push(r); } else arr[i] = r; } };
  up(D.docs, j.docs || [], x => x.linkKey);
  up(D.pos, j.pos || [], x => x.poNb);
  if (JSON.stringify(D.reviews) !== JSON.stringify(j.reviews || [])){ D.reviews = j.reviews || []; ch = true; }
  for (const k in j.meta || {}){ if (!/^(sync|sync_err)$/.test(k)) ch = true; D.meta[k] = j.meta[k]; }
  for (const k in j.detPart || {}){ D.meta[k] = Object.assign(D.meta[k] || {}, j.detPart[k]); ch = true; }
  D.comments = D.comments || {}; for (const k in j.comments || {}){ D.comments[k] = j.comments[k]; ch = true; }
  D.now = j.now;
  return ch;
}
async function load(quiet){
  try{
    const since = quiet && S.data && S.data.now ? S.data.now : "";
    const j = await api("data" + (since ? "?since=" + encodeURIComponent(since) : ""));
    if (!j.user){ $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); return; }
    $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
    $("#who").textContent = j.user.name + " 님";
    $("#acctBtn").classList.toggle("hidden", j.user.lv !== "admin");
    if (!j.user.canView){ go("deny"); return; }
    let changed = true;
    if (j.delta && S.data){ changed = mergeDelta(S.data, j); j.meta = S.data.meta; }
    else { S.data = j; }
    if (changed) judge();
    const m = S.data.meta.sync || {}, e = S.data.meta.sync_err;
    const late = e && (!m.at || e.at > m.at);
    $("#syncInfo").textContent = late ? `⚠ 수집 실패 ${e.at.slice(5)} — ${e.msg}` : `그룹웨어 수집 ${m.at ? m.at.slice(5) : "-"} · 10분마다`;
    $("#syncInfo").classList.toggle("bad", !!late);
    if (!quiet) go(S.page === "deny" ? "main" : S.page); else if (changed) render();
  }catch(err){ toast(err.message); }
}
$("#lbtn").onclick = async () => {
  $("#lerr").textContent = "";
  try{ await api("login", { id: $("#lid").value.trim(), pw: $("#lpw").value }); $("#lpw").value = ""; load(); }
  catch(e){ $("#lerr").textContent = e.message; }
};
$("#lpw").onkeydown = (e) => { if (e.key === "Enter") $("#lbtn").click(); };
$("#lid").onkeydown = (e) => { if (e.key === "Enter") $("#lpw").focus(); };
$("#acctBtn").onclick = () => { ACC4 = null; go("acct"); };
$("#logout").onclick = async () => { await api("logout", {}).catch(() => {}); location.reload(); };
$("#syncInfo").onclick = () => load(true).then(() => toast("새로 불러왔습니다"));
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("[data-close]") || t === $("#mask")) return closeModal();
  /* 문서번호 → 아마란스 결재문서를 새 탭이 아니라 팝업 창으로(아마란스가 결재문서를 여는 크기와 같게) — 2026-11-06 사용자: "새창을 들어가서 확인하는거 말고 팝업처럼 화면에 띄워주면".
     우리 창 안에 넣으면(iframe) 그룹웨어 로그인 쿠키(SameSite=Lax)가 안 실려 로그인 화면만 뜸 → 팝업 창으로. 같은 이름 창을 다시 써서 창이 쌓이지 않게 */
  const gd = t.closest("a.gwdoc"); if (gd){ e.preventDefault();
    const w = Math.min(1050, screen.availWidth - 40), h = screen.availHeight - 60, l = (screen.availLeft || 0) + Math.max(0, (screen.availWidth - w) / 2), tp = (screen.availTop || 0) + 20;
    const win = window.open(gd.href, "ctr-eap", `popup=yes,width=${w},height=${h},left=${l},top=${tp},resizable=yes,scrollbars=yes`);
    if (win) win.focus(); else window.open(gd.href, "_blank");
    return; }
  /* 아마란스 발주등록 열기 —주소로 발주번호를 넘길 수 없어 번호를 복사해 두고 화면만 연다(그룹웨어에 로그인된 브라우저에서) */
  const gw = t.closest("[data-gwpo]"); if (gw){ const n = gw.dataset.gwpo;
    window.open("https://gw.ctrenergy.co.kr/#/PO/POC0010/POC0010", "_blank", "noopener");
    (navigator.clipboard ? navigator.clipboard.writeText(n) : Promise.reject()).then(() => toast(n + " 복사됨 — 발주등록 발주번호 칸에 붙여넣기(Ctrl+V) 후 조회"), () => toast("발주번호 " + n + " 로 조회해 주세요"));
    return; }
  const rv = t.closest("[data-rv]"); if (rv) return saveReview(rv);
  const mp = t.closest("tr[data-mpo]"); if (mp){ const n = mp.dataset.mpo; S.open.has(n) ? S.open.delete(n) : S.open.add(n); return renderMain(); }
  const ms = t.closest("[data-mst]"); if (ms){ S.f.main.st = ms.dataset.mst; return renderMain(); }
  const po = t.closest("[data-po]"); if (po) return showPo(po.dataset.po);
  const rj = t.closest("tr[data-rej]"); if (rj) return showRej(rj.dataset.rej);
  const rl = t.closest("[data-rlv]"); if (rl){ S.f.rej.lv = rl.dataset.rlv; S.f.rej.st = ""; return renderRej(); }
  const cs = t.closest("[data-case]"); if (cs) return showCase(cs.dataset.case);
  const dc = t.closest("tr[data-doc]"); if (dc){ const d = S.docs.find(x => x.linkKey === dc.dataset.doc); const c = S.cases.find(x => x.key === "doc:" + d.linkKey); return showDoc(d, c); }
  const wh = t.closest("tr[data-who]"); if (wh){ S.f.check.who = wh.dataset.who; S.f.check.st = "open"; return go("check"); }
  const kd = t.closest("tr[data-kind]"); if (kd){ S.f.check.kind = kd.dataset.kind; S.f.check.st = "open"; S.f.check.who = ""; return go("check"); }
  const g = t.closest("[data-go]");
  if (g){ if (g.dataset.st) S.f.docs.st = g.dataset.st; if (g.dataset.cst) S.f.check.st = g.dataset.cst; return go(g.dataset.go); }
});
/* [data-tip] 위에 마우스를 올리면 바로 아래에 글 팝업 — ④ 문서번호 → 기안서 제목 */
document.addEventListener("mouseover", (e) => { const a = e.target.closest && e.target.closest("[data-tip]"); let t = $("#tip");
  if (!a){ if (t) t.remove(); return; }
  if (!t){ t = document.createElement("div"); t.id = "tip"; document.body.appendChild(t); }
  t.textContent = a.dataset.tip; const r = a.getBoundingClientRect(); t.style.left = Math.max(8, Math.min(r.left, innerWidth - t.offsetWidth - 12)) + "px";
  t.style.top = (r.bottom + 6 + t.offsetHeight > innerHeight ? r.top - t.offsetHeight - 6 : r.bottom + 6) + "px"; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#mask").classList.contains("hidden")) closeModal(); });
setInterval(() => { if (!document.hidden && $("#mask").classList.contains("hidden") && S.data) load(true); }, 5 * 60e3);   /* 5분마다 조용히 새로 불러오기 */
load();
</script>
